services:
  - type: web
    name: aivoa-complaint-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aivoa-postgres
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: aivoa-complaint-ui
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: aivoa-postgres
    plan: free
    databaseName: aivoa
    user: aivoa
